<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agendei</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
font-family:Arial;
margin:0;
background:#f5f5f5;
}

.tela{
display:none;
padding:20px;
padding-bottom:90px;
}

.tela.ativa{
display:block;
}

input, select{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:15px;
border-radius:6px;
border:1px solid #ccc;
}

button{
padding:12px;
border:none;
border-radius:6px;
background:#2b7cff;
color:white;
width:100%;
}

.card{
background:white;
padding:15px;
border-radius:8px;
margin-bottom:10px;
}

.menu{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
border-top:1px solid #ddd;
display:flex;
justify-content:space-around;
padding:10px 0;
}

.menu button{
background:none;
color:black;
font-size:14px;
}

</style>

</head>

<body>

<!-- TELA AGENDAR -->

<div id="telaAgendar" class="tela ativa">

<h2>Agendar</h2>

<label>Cliente</label>
<input id="cliente">

<label>WhatsApp</label>
<input id="whatsapp">

<label>Serviço</label>
<select id="servico">
<option>Corte</option>
<option>Barba</option>
</select>

<label>Profissional</label>
<select id="profissional">
<option>João</option>
<option>Carlos</option>
</select>

<label>Data</label>
<input type="date" id="data">

<label>Horário disponível</label>
<select id="hora"></select>

<button onclick="agendar()">Agendar</button>

</div>


<!-- TELA AGENDAMENTOS -->

<div id="telaAgendei" class="tela">

<h2>Agendamentos</h2>

<div id="listaAgendamentos"></div>

</div>


<!-- TELA CONFIG -->

<div id="telaConfig" class="tela">

<h2>Configurações</h2>

<h3>Serviços</h3>

<input id="novoServico" placeholder="Novo serviço">

<button onclick="addServico()">Adicionar serviço</button>

<div id="listaServicos"></div>

<hr>

<h3>Profissionais</h3>

<input id="novoProf" placeholder="Novo profissional">

<button onclick="addProf()">Adicionar profissional</button>

<div id="listaProf"></div>

</div>


<!-- MENU -->

<div class="menu">

<button onclick="mostrarTela('telaAgendar')">Agendar</button>

<button onclick="mostrarTela('telaAgendei')">Agendei</button>

<button onclick="mostrarTela('telaConfig')">Config</button>

</div>


<script>

function gerarHorarios(){

let select = document.getElementById("hora")

select.innerHTML=""

let inicio = 9
let fim = 18

for(let h = inicio; h < fim; h++){

let hora = h.toString().padStart(2,"0")+":00"

let ocupado = agendamentos.find(a=>a.hora==hora)

if(!ocupado){

select.innerHTML += `<option>${hora}</option>`

}

}

}

</script>

</body>
</html>
