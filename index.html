<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agendei</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
font-family:Arial;
margin:0;
background:#f5f5f5;
}

.tela{
display:none;
padding:20px;
padding-bottom:90px;
}

.tela.ativa{
display:block;
}

input, select{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:15px;
border-radius:6px;
border:1px solid #ccc;
}

button{
padding:12px;
border:none;
border-radius:6px;
background:#2b7cff;
color:white;
width:100%;
}

.card{
background:white;
padding:15px;
border-radius:8px;
margin-bottom:10px;
}

.menu{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
border-top:1px solid #ddd;
display:flex;
justify-content:space-around;
padding:10px 0;
}

.menu button{
background:none;
color:black;
font-size:14px;
}

</style>

</head>

<body>

<!-- TELA AGENDAR -->

<div id="telaAgendar" class="tela ativa">

<h2>Agendar</h2>

<label>Cliente</label>
<input id="cliente">

<label>WhatsApp</label>
<input id="whatsapp">

<label>Serviço</label>
<select id="servico">
<option>Corte</option>
<option>Barba</option>
</select>

<label>Profissional</label>
<select id="profissional">
<option>João</option>
<option>Carlos</option>
</select>

<label>Data</label>
<input type="date" id="data">

<label>Hora</label>
<input type="time" id="hora">

<button onclick="agendar()">Agendar</button>

</div>


<!-- TELA AGENDAMENTOS -->

<div id="telaAgendei" class="tela">

<h2>Agendamentos</h2>

<div id="listaAgendamentos"></div>

</div>


<!-- TELA CONFIG -->

<div id="telaConfig" class="tela">

<h2>Configurações</h2>

<h3>Serviços</h3>

<input id="novoServico" placeholder="Novo serviço">

<button onclick="addServico()">Adicionar serviço</button>

<div id="listaServicos"></div>

<hr>

<h3>Profissionais</h3>

<input id="novoProf" placeholder="Novo profissional">

<button onclick="addProf()">Adicionar profissional</button>

<div id="listaProf"></div>

</div>


<!-- MENU -->

<div class="menu">

<button onclick="mostrarTela('telaAgendar')">Agendar</button>

<button onclick="mostrarTela('telaAgendei')">Agendei</button>

<button onclick="mostrarTela('telaConfig')">Config</button>

</div>


<script>

let agendamentos = []

let servicos = ["Corte","Barba"]

let profissionais = ["João","Carlos"]



function mostrarTela(tela){

document.querySelectorAll(".tela")
.forEach(t=>t.classList.remove("ativa"))

document.getElementById(tela).classList.add("ativa")

if(tela=="telaAgendei") atualizarAgendamentos()

if(tela=="telaConfig") atualizarConfig()

}



function agendar(){

let cliente = document.getElementById("cliente").value

let whatsapp = document.getElementById("whatsapp").value

let servico = document.getElementById("servico").value

let profissional = document.getElementById("profissional").value

let data = document.getElementById("data").value

let hora = document.getElementById("hora").value


agendamentos.push({

cliente,
whatsapp,
servico,
profissional,
data,
hora

})

alert("Agendamento realizado")

}



function atualizarAgendamentos(){

let lista = document.getElementById("listaAgendamentos")

lista.innerHTML = ""

agendamentos.forEach(a=>{

lista.innerHTML += `

<div class="card">

<strong>${a.cliente}</strong><br>

${a.servico} - ${a.profissional}<br>

${a.data} às ${a.hora}

</div>

`

})

}



function atualizarConfig(){

let listaServ = document.getElementById("listaServicos")

listaServ.innerHTML=""

servicos.forEach(s=>{

listaServ.innerHTML += `<div class="card">${s}</div>`

})


let listaProf = document.getElementById("listaProf")

listaProf.innerHTML=""

profissionais.forEach(p=>{

listaProf.innerHTML += `<div class="card">${p}</div>`

})

}



function addServico(){

let nome = document.getElementById("novoServico").value

servicos.push(nome)

document.getElementById("novoServico").value=""

atualizarConfig()

}



function addProf(){

let nome = document.getElementById("novoProf").value

profissionais.push(nome)

document.getElementById("novoProf").value=""

atualizarConfig()

}


</script>

</body>
</html>
