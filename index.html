<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendei</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<header>

<h1>Agendei</h1>

</header>


<main>

<!-- AGENDAR -->

<section id="telaAgendar" class="tela">

<h2>Novo Agendamento</h2>

<input id="cliente" placeholder="Nome do cliente">

<input id="whatsapp" placeholder="WhatsApp">

<select id="servico"></select>

<select id="profissional"></select>

<input type="date" id="data">

<select id="hora"></select>

<button onclick="agendar()">Agendar</button>

</section>


<!-- AGENDAMENTOS -->

<section id="telaAgendei" class="tela" style="display:none">

<h2>Agendamentos</h2>

<div id="listaAgendamentos"></div>

</section>


<!-- CONFIG -->

<section id="telaConfig" class="tela" style="display:none">

<h2>Serviços</h2>

<input id="novoServico" placeholder="Nome do serviço">

<input id="duracaoServico" placeholder="Duração (min)">

<button onclick="adicionarServico()">Adicionar</button>

<div id="listaServicos"></div>


<h2>Profissionais</h2>

<input id="novoProfissional" placeholder="Nome">

<button onclick="adicionarProfissional()">Adicionar</button>

<div id="listaProfissionais"></div>

</section>

</main>


<!-- MENU -->

<div class="menu">

<button onclick="mostrarTela('telaAgendar')">Agendar</button>

<button onclick="mostrarTela('telaAgendei')">Agendei</button>

<button onclick="mostrarTela('telaConfig')">Config</button>

</div>

<script src="app.js"></script>

</body>
</html>
